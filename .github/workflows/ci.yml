name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22   # node:sqlite
          cache: npm
      - run: npm ci
      # Merge gate: any cross-tenant leak fails the build.
      - name: Cross-tenant isolation gate
        run: npm run test:isolation
      - name: Unit + API tests
        run: npm test
