<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Create your AccessX account</title>
<style>
  :root{--fg:#1d2433;--muted:#667085;--line:#e4e7ec;--ok:#067647;--bad:#b42318;--btn:#1d4ed8}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);background:#f6f7f9;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;max-width:440px;width:100%}
  h1{font-size:20px;margin:0 0 8px}
  .meta{color:var(--muted);font-size:14px}
  button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--btn);color:#fff;font-size:17px;font-weight:600;cursor:pointer}
  button.secondary{background:#fff;color:var(--btn);border:1px solid var(--btn);margin-top:10px;padding:10px;font-size:15px}
  button:disabled{opacity:.6;cursor:default}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  label{display:block;font-size:14px;font-weight:600;margin-top:14px}
  label.check{font-weight:400;display:flex;gap:8px;align-items:flex-start}
  label.check input{width:auto;margin-top:4px}
  input,select{width:100%;margin-top:4px;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px}
  .key{font:15px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:#f2f4f7;border:1px dashed #98a2b3;border-radius:8px;padding:12px;word-break:break-all;margin-top:10px}
  .trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
  ol{padding-left:20px;margin:8px 0}
</style>
</head>
<body>
<main class="card" id="box" aria-live="polite">
  <h1>Loading…</h1>
</main>
<script src="signup.js"></script>
</body>
</html>
