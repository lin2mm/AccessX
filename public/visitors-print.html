<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>AccessX · Who is on site</title>
<style>
  :root{--txt:#16181d;--txt2:#4a4f59;--line:#dde0e6;--bad:#b42318}
  *{box-sizing:border-box}
  body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);max-width:960px;margin:0 auto;padding:24px}
  h1{font-size:22px;margin:0 0 4px}
  h2{font-size:16px;margin:24px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--txt)}
  .meta{color:var(--txt2);font-size:12px}
  table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--txt2)}
  td.box{width:34px;font-size:18px}
  .bar{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
  .bar select,.bar button{font:inherit;padding:6px 10px}
  .bad{color:var(--bad)}
  .foot{margin-top:24px;font-size:12px;color:var(--txt2);border-top:1px solid var(--line);padding-top:8px}
  @media print{.bar{display:none} body{padding:0} tr{break-inside:avoid}}
</style>
</head>
<body>
<h1>Who is on site</h1>
<div class="meta" id="sub">Loading…</div>
<div class="bar">
  <label>Site <select id="site"><option value="">All sites</option></select></label>
  <button id="print" type="button">Print</button>
  <button id="reload" type="button">Refresh</button>
</div>
<div id="out"></div>
<div class="foot">Visitors only (staff are not listed). "On site" = signed in at a kiosk, let in by reception, or opened a door with their code, and not checked out. Contains personal data: shred after use.</div>
<script src="visitors-print.js"></script>
</body>
</html>
